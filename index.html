<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>VHS Camera</title>

<style>
    body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: monospace;
        color: white;
    }

    #wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: black;
    }

    video, canvas {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    /* الخطوط الأفقية (scanlines) */
    #scanlines {
        position: absolute;
        width:100%;
        height:100%;
        pointer-events:none;
        background: repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,0.03),
            rgba(255,255,255,0.03) 2px,
            rgba(0,0,0,0) 4px
        );
        mix-blend-mode: overlay;
    }

    /* إطار VHS */
    #vhsFrame {
        position: absolute;
        inset: 0;
        pointer-events: none;
        border: 8px solid rgba(255,255,255,0.15);
        box-shadow: 0 0 40px rgba(0,0,0,0.8) inset;
    }

    /* التاريخ */
    #timestamp {
        position: absolute;
        bottom: 20px;
        left: 20px;
        font-size: 22px;
        color: white;
        text-shadow: 0 0 5px black;
        pointer-events: none;
    }
</style>

</head>
<body>

<div id="wrapper">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="scanlines"></div>
    <div id="vhsFrame"></div>

    <div id="timestamp">DEC 06 2025  11:14 PM</div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

navigator.mediaDevices.getUserMedia({ video:true, audio:false })
    .then(stream => {
        video.srcObject = stream;
        requestAnimationFrame(drawVHS);
    });

function drawVHS() {
    if (!video.videoWidth) {
        requestAnimationFrame(drawVHS);
        return;
    }

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    // رسم الفيديو
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    let frame = ctx.getImageData(0,0,canvas.width,canvas.height);
    let d = frame.data;

    for (let i = 0; i < d.length; i += 4) {
        // Grain
        let noise = (Math.random() - 0.5) * 30;
        d[i] += noise;
        d[i+1] += noise;
        d[i+2] += noise;

        // Slight tint (قديم / متسخ)
        d[i] *= 0.95;  
        d[i+1] *= 0.92; 
        d[i+2] *= 0.90;
    }

    ctx.putImageData(frame,0,0);

    // خط تشويش عشوائي يتحرك
    if (Math.random() < 0.15) {
        let y = Math.random() * canvas.height;
        ctx.fillStyle = "rgba(255,255,255,0.2)";
        ctx.fillRect(0, y, canvas.width, 2);
    }

    // Flicker
    canvas.style.opacity = 0.90 + Math.random() * 0.1;

    requestAnimationFrame(drawVHS);
}
</script>

</body>
</html>
